<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove - System Portal Login</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../css/portal-login.css">
</head>
<body class="portal-login-body">
    <div class="login-card">
        <h1 class="login-title">System Portal</h1>
        <p class="login-subtitle">Authorized Personnel Only</p>
        
        <form id="loginForm" novalidate>
            <div id="loginMessage" class="login-error-msg">Invalid credentials.</div>
            
            <div class="form-group login-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control check-valid" placeholder="admin">
                <div class="error-msg" id="error-username">Username is required.</div>
            </div>
            
            <div class="form-group login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control check-valid" placeholder="admin123">
                <div class="error-msg" id="error-password">Password is required.</div>
            </div>
            
            <button type="submit" id="submitBtn" class="btn-primary login-btn-submit" disabled>Sign In</button>
        </form>
        
        <div class="login-footer-link">
            <a href="../index.html" class="login-return-link">&larr; Return to Public Site</a>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/admin-login.js"></script>
</body>
</html>
