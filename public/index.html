<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMove Transport Solutions</title>
    <link rel="stylesheet" href="global.css">
    <!-- Lenis & GSAP -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        .routes-scroller {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 2rem;
            scrollbar-width: none; /* Firefox */
        }

        .routes-scroller::-webkit-scrollbar {
            display: none;
        }

        .route-mini-card {
            min-width: 300px;
            background: var(--solid-card-bg);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease;
        }

        .route-mini-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <!-- Hero Section -->
    <div class="hero-wrapper"
        style="background-image: url('https://i.postimg.cc/PJxNzHkC/cristina-gottardi-CSpj-U6h-Yo-0-unsplash.jpg');">
        <header class="hero-header gsap-fade-down">
            <a href="index.html" class="hero-logo" style="font-size: 1.5rem;">SmartMove.</a>
            <nav class="hero-nav">
                <a href="routes.html">Routes</a>
                <a href="reviews.html">Reviews</a>
                <a href="book.html">Book Ticket</a>
            </nav>
            <div class="hero-actions">
                <a href="system-portal/login.html" class="btn-transparent"
                    style="border: 1px solid white; padding: 0.5rem 1.5rem; border-radius: 99px;">Admin Login</a>
            </div>
        </header>
        <div class="hero-left-widget gsap-fade-right"
            style="background: transparent; border: none; backdrop-filter: none; top: 30%; left: 4rem;">
            <div class="avatars">
                <img src="https://i.pravatar.cc/100?img=33" alt="User">
                <img src="https://i.pravatar.cc/100?img=47" alt="User">
                <img src="https://i.pravatar.cc/100?img=12" alt="User">
                <img src="https://i.pravatar.cc/100?img=5" alt="User">
            </div>
            <div
                style="font-size: 0.85rem; line-height: 1.2; opacity: 0.9; color: white; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 1rem; height: 36px; display: flex; align-items: center;">
                50K have used<br>our services
            </div>
        </div>

        <div class="hero-content-area gsap-scale-up">
            <h1 class="hero-title">
                Crafting <span class="pill-text pill-white">Journeys</span><br>
                Not <span class="pill-text pill-orange">Just</span> Trips.
            </h1>
        </div>

        <div class="hero-right-widget gsap-fade-left"
            style="top: 25%; right: 5rem; background: rgba(255,255,255,0.1); border: none; padding: 1.5rem; border-radius: 16px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem; font-weight: 600;">Seamless Commutes</h3>
            <p style="font-size: 0.8rem; line-height: 1.4; opacity: 0.9;">
                Experience the next generation of university transportation. Plan trips, track routes, and ride with
                comfort.
            </p>
        </div>
