<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartMove - Book a Ticket</title>

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <header class="standard-header">

        <a href="index.html" class="logo">
            SmartMove.
        </a>

        <nav class="standard-nav">
            <a href="routes.html">Routes</a>
            <a href="reviews.html">Reviews</a>
            <a href="book.html" style="color: var(--primary-accent);">
                Book Ticket
            </a>
        </nav>

        <div class="hero-actions">
            <a href="system-portal/login.html" class="btn-transparent" style="color: var(--text-main);">
                Admin Login
            </a>
        </div>

    </header>
    <main class="page-main">

        <div style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        align-items: start;
    ">
            <!-- Submit Booking -->
            <div class="gsap-fade-right">

                <h1 class="section-title">
                    Book Your Journey
                </h1>

                <p style="margin-bottom: 2rem; color: var(--text-secondary);">
                    Select your route and book your ticket instantly.
                </p>

                <div class="glass-panel" style="padding: 3rem;">

                    <form id="bookingForm" novalidate>

                        <!-- Passenger Details -->
                        <div class="form-group">

                            <label>Passenger Details</label>

                            <input type="text" id="firstName" class="form-control" placeholder="First Name" required
                                style="margin-bottom: 0.5rem;" oninput="validateForm()">

                            <input type="text" id="lastName" class="form-control" placeholder="Last Name" required
                                style="margin-bottom: 0.5rem;" oninput="validateForm()">

                            <input type="email" id="email" class="form-control" placeholder="Email Address" required
                                style="margin-bottom: 0.5rem;" oninput="validateForm()">

                            <input type="text" id="phone" class="form-control" placeholder="Phone Number" required
                                oninput="validateForm()">

                        </div>
                        <!-- Route Details -->
                        <div class="form-group">

                            <label>Route Details</label>

                            <input type="text" id="startLocation" class="form-control" placeholder="Start Location"
                                required style="margin-bottom: 0.5rem;" oninput="validateForm()">

                            <input type="text" id="endLocation" class="form-control" placeholder="End Location" required
                                oninput="validateForm()">

                        </div>
                        <!-- Payment Method -->
                        <div class="form-group">

                            <label for="paymentMethod">
                                Payment Method
                            </label>

                            <input type="text" id="paymentMethod" class="form-control"
                                placeholder="e.g. Card, Cash, Bank Transfer" required oninput="validateForm()"
                                style="margin-bottom: 1.5rem;">

                        </div>

                    </form>

                </div>

            </div>
            <!-- Right Column: Info -->
            <div class="gsap-fade-left">

                <h2 style="font-size: 1.8rem; margin-bottom: 2rem;">
                    Why book with us?
                </h2>

                <div style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 3rem;
    ">
                    <!-- Flexible Payment -->
                    <div class="glass-panel" style="padding: 2rem;">

                        <div style="
                margin-bottom: 0.5rem;
                color: var(--primary-accent);
            ">

                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <rect x="1" y="4" width="22" height="16" rx="2" ry="2">
                                </rect>

                                <line x1="1" y1="10" x2="23" y2="10">
                                </line>

                            </svg>

                        </div>

                        <h3 style="
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            ">
                            Flexible
                        </h3>

                        <p style="
                color: var(--text-secondary);
                font-size: 0.95rem;
            ">
                            Pay securely online or choose to pay cash.
                        </p>

                    </div>
